name: Memory Module Tests

on:
  push:
    branches:
      - feature/memory-dialog-bridge
    paths:
      - "bot.py"
      - "test_bot.py"
      - "memory/**"
      - "tests/memory/**"
      - "tools/install_backup_tools.py"
      - ".github/workflows/memory-tests.yml"
  pull_request:
    paths:
      - "bot.py"
      - "test_bot.py"
      - "memory/**"
      - "tests/memory/**"
      - "tools/install_backup_tools.py"
      - ".github/workflows/memory-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-memory:
    name: Full memory test suite (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check memory module syntax
        run: python -m compileall -q bot.py test_bot.py memory tests/memory tools

      - name: Install verified backup tools
        run: python tools/install_backup_tools.py --directory /tmp/psychologia-backup-tools

      - name: Run every memory unit test
        env:
          TEST_BACKUP_TOOLS_DIR: /tmp/psychologia-backup-tools
          REQUIRE_NATIVE_BACKUP_TESTS: "1"
        run: python -m unittest discover -s tests/memory -p "test_*.py" -v

      - name: Publish run summary
        if: always()
        run: |
          echo "## Memory tests" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: \`$GITHUB_REF_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the **Run every memory unit test** step for the full results." >> "$GITHUB_STEP_SUMMARY"
