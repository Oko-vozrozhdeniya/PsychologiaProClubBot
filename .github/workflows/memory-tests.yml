name: Memory Module Tests

on:
  push:
    branches:
      - feature/memory-dialog-bridge
    paths:
      - "memory/**"
      - "tests/memory/**"
      - ".github/workflows/memory-tests.yml"
  pull_request:
    paths:
      - "memory/**"
      - "tests/memory/**"
      - ".github/workflows/memory-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-memory:
    name: Full memory test suite (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check memory module syntax
        run: python -m compileall -q memory tests/memory

      - name: Run every memory unit test
        run: python -m unittest discover -s tests/memory -p "test_*.py" -v

      - name: Publish run summary
        if: always()
        run: |
          echo "## Memory tests" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: \`$GITHUB_REF_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the **Run every memory unit test** step for the full results." >> "$GITHUB_STEP_SUMMARY"
