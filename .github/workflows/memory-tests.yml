
name: Memory Storage Tests

on:
  push:
    paths:
      - "memory/**"
      - "tests/memory/**"
      - ".github/workflows/memory-tests.yml"
  pull_request:
    paths:
      - "memory/**"
      - "tests/memory/**"
      - ".github/workflows/memory-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-memory:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run memory storage tests
        run: python -m unittest discover -s tests/memory -p "test_*.py" -v
